name: Build

# Builds the Docker image on GitHub and publishes it to ghcr.io so the
# deploy host only pulls images (no builds on the server). The build
# context is a workspace holding this repo plus Signalix-contracts, the
# same layout as proyect/ locally.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: Signalix-api
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Signalix-contracts
          ref: ${{ env.BRANCH }}
          path: Signalix-contracts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Signalix-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/signalix-api:${{ env.BRANCH }}
            ghcr.io/${{ github.repository_owner }}/signalix-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=signalix-api
          cache-to: type=gha,mode=max,scope=signalix-api
      - uses: docker/build-push-action@v6
        with:
          context: Signalix-api
          file: Signalix-api/Dockerfile.flyway
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/signalix-flyway:${{ env.BRANCH }}
            ghcr.io/${{ github.repository_owner }}/signalix-flyway:sha-${{ github.sha }}
